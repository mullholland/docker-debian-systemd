---
name: Build and push

on:
  pull_request:
  push:
    branches:
      - main
  schedule:
    - cron: "10 2 * * 0"

jobs:
  smoke-test:
    name: Molecule smoke test
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        context: [12, 13]
    steps:
      - uses: actions/checkout@v6
      - name: Build image
        run: docker build -t smoke-test:${{ matrix.context }} ./${{ matrix.context }}
      - name: Boot container like Molecule's docker driver
        run: |
          docker run -d --name smoke --privileged --cgroupns=host --tty \
            --volume /sys/fs/cgroup:/sys/fs/cgroup:rw \
            smoke-test:${{ matrix.context }}
      - name: Wait for systemd to become ready
        run: |
          for i in $(seq 1 30); do
            if [ "$(docker inspect -f "{{.State.Running}}" smoke)" != "true" ]; then
              echo "::error::container exited before systemd became ready"
              docker logs smoke
              exit 1
            fi
            state=$(docker exec smoke systemctl is-system-running 2>/dev/null || true)
            case "$state" in
              running|degraded) echo "init ready: $state"; exit 0 ;;
            esac
            sleep 2
          done
          echo "::error::systemd never became ready"
          docker logs smoke
          exit 1
      - name: Verify Python interpreter for Ansible
        run: docker exec smoke python3 --version
      - name: Verify package manager
        run: docker exec smoke apt-get --version
      - name: Cleanup
        if: always()
        run: docker rm -f smoke

  build-and-push:
    name: Release
    runs-on: ubuntu-latest
    needs: smoke-test
    if: github.ref == 'refs/heads/main'

    strategy:
      matrix:
        include:
          - context: 12
            tags: |
              ${{ github.repository }}:12
              ghcr.io/${{ github.repository }}:12
              ${{ github.repository }}:bookworm
              ghcr.io/${{ github.repository }}:bookworm
          - context: 13
            tags: |
              ${{ github.repository }}:13
              ghcr.io/${{ github.repository }}:13
              ${{ github.repository }}:trixie
              ghcr.io/${{ github.repository }}:trixie
              ${{ github.repository }}:latest
              ghcr.io/${{ github.repository }}:latest

    steps:
      - uses: actions/checkout@v6
      - uses: docker/setup-qemu-action@v4
      - uses: docker/setup-buildx-action@v4

      - name: Login to DockerHub
        uses: docker/login-action@v4
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Login to GitHub Container Registry
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.repository_owner }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push image.
        uses: docker/build-push-action@v7
        with:
          context: ./${{ matrix.context }}
          file: ./${{ matrix.context }}/Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ matrix.tags }}
